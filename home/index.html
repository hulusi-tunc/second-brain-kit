<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
  /* Brain Home: the dial of your brain. Every name keeps its place and only its distance from the
     middle changes (closer needs you more); the map is for going places, reading and acting happen in
     the panel on the right. Clicking a name flies into it, its people and things gather around it;
     what Brain filed since yesterday waits in Review for your yes, and Today puts what is late next to
     what Slack shows heading your way. Follows the Mac's light or dark look, Apple's system colours and
     glass, pink only where something is late. */
  :root {
    --bg: #f2f2f7; --bg2: #ffffff; --ink: #1d1d1f; --ink2: rgb(60 60 67 / 0.62); --ink3: rgb(60 60 67 / 0.32); --line: rgb(60 60 67 / 0.12);
    --sheet: rgb(255 255 255 / 0.5); --card: rgb(255 255 255 / 0.62); --chip: rgb(118 118 128 / 0.1); --chip2: rgb(118 118 128 / 0.18);
    --pink: #ff2d55; --pinkBg: rgb(255 45 85 / 0.1);
    --glass: rgb(255 255 255 / 0.52); --solid: rgb(250 250 252 / 0.78);
    --shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.9), inset 0 0 0 0.5px rgb(255 255 255 / 0.5), 0 0 0 0.5px rgb(0 0 0 / 0.1), 0 14px 44px -14px rgb(0 0 0 / 0.22);
    --ease: cubic-bezier(0.23, 1, 0.32, 1); --slide: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) {
    --bg: #000000; --bg2: #1c1c1e; --ink: #f5f5f7; --ink2: rgb(235 235 245 / 0.6); --ink3: rgb(235 235 245 / 0.28); --line: rgb(255 255 255 / 0.09);
    --sheet: rgb(40 40 44 / 0.42); --card: rgb(255 255 255 / 0.06); --chip: rgb(118 118 128 / 0.22); --chip2: rgb(118 118 128 / 0.34);
    --pink: #ff375f; --pinkBg: rgb(255 55 95 / 0.16);
    --glass: rgb(44 44 48 / 0.48); --solid: rgb(36 36 40 / 0.82);
    --shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.2), inset 0 0 0 0.5px rgb(255 255 255 / 0.1), 0 0 0 0.5px rgb(0 0 0 / 0.5), 0 22px 56px -18px rgb(0 0 0 / 0.75);
  } }
  :root[data-theme='dark'] {
    --bg: #000000; --bg2: #1c1c1e; --ink: #f5f5f7; --ink2: rgb(235 235 245 / 0.6); --ink3: rgb(235 235 245 / 0.28); --line: rgb(255 255 255 / 0.09);
    --sheet: rgb(40 40 44 / 0.42); --card: rgb(255 255 255 / 0.06); --chip: rgb(118 118 128 / 0.22); --chip2: rgb(118 118 128 / 0.34);
    --pink: #ff375f; --pinkBg: rgb(255 55 95 / 0.16);
    --glass: rgb(44 44 48 / 0.48); --solid: rgb(36 36 40 / 0.82);
    --shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.2), inset 0 0 0 0.5px rgb(255 255 255 / 0.1), 0 0 0 0.5px rgb(0 0 0 / 0.5), 0 22px 56px -18px rgb(0 0 0 / 0.75);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 400 13px/19px system-ui, ui-sans-serif, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
  canvas.dragging { cursor: grabbing; }
  a { color: inherit; }

  /* ---------- the stage: what floats over the map */
  .crumbs { position: fixed; top: 20px; left: 22px; display: flex; align-items: center; gap: 2px; height: 32px; padding: 3px; border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px) saturate(1.4);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 0.2s var(--ease), transform 0.3s var(--ease); }
  .crumbs.on { opacity: 1; transform: none; pointer-events: auto; }
  .crumbs button { height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: transparent; color: var(--ink2); font: 500 12px system-ui; cursor: pointer; white-space: nowrap; }
  .crumbs button:hover { background: var(--chip); color: var(--ink); }
  .crumbs button:last-child { color: var(--ink); }
  .crumbs .sep { color: var(--ink3); font-size: 12px; }
  .crumbs .home { display: inline-flex; align-items: center; gap: 6px; }

  .dock { position: fixed; bottom: 20px; display: flex; gap: 8px; align-items: center; transform: translateX(-50%); transition: opacity 0.18s ease, translate 0.18s ease; }
  .dock:not(.on):not(:focus-within) { opacity: 0; translate: 0 8px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .dock { transition: opacity 0.12s linear; translate: none !important; } }
  .pills { display: flex; gap: 2px; padding: 3px; border-radius: 17px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
  .zoom { display: flex; gap: 2px; padding: 3px; border-radius: 17px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
  .zoom button { min-width: 28px; height: 28px; padding: 0 9px; border: 0; border-radius: 14px; background: transparent; color: var(--ink2); font: 500 13px system-ui; cursor: pointer; transition: background 0.15s ease, transform 0.12s ease; }
  .zoom button:hover { background: var(--chip); color: var(--ink); }
  .zoom button:active { transform: scale(0.94); }
  .pill { height: 28px; padding: 0 11px; border-radius: 14px; border: 0; background: transparent; color: var(--ink2); font: 500 12px system-ui; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s ease, color 0.15s ease; }
  .pill:hover { background: var(--chip); }
  .pill[aria-pressed='true'] { color: var(--ink); }
  .pill[aria-pressed='false'] { color: var(--ink3); }
  .pill .sw { width: 8px; height: 8px; background: currentColor; opacity: 0.85; }
  .pill[aria-pressed='false'] .sw { background: transparent; box-shadow: inset 0 0 0 1.2px currentColor; }
  .time { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 13px 0 3px; border-radius: 17px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); }
  .play { width: 28px; height: 28px; border-radius: 14px; border: 0; background: var(--chip); cursor: pointer; display: grid; place-items: center; transition: transform 0.12s ease; }
  .play:active { transform: scale(0.94); }
  .time .lbl { font: 500 12px system-ui; color: var(--ink2); }
  .time input[type=range] { width: 170px; accent-color: var(--ink); }
  .time .when { font: 500 12px system-ui; color: var(--ink); min-width: 46px; font-variant-numeric: tabular-nums; }

  .filed { position: fixed; left: 22px; top: 20px; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 5px 0 13px; border: 0; border-radius: 17px;
    background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(20px); cursor: pointer; font: 500 12px system-ui; color: var(--ink2);
    transition: opacity 0.2s ease, transform 0.3s var(--ease); }
  .filed:active { transform: scale(0.97); }
  .filed .dot { width: 7px; height: 7px; border-radius: 4px; background: var(--ink); }
  .filed b { color: var(--ink); font-weight: 600; }
  .filed .go { height: 24px; padding: 0 10px; border-radius: 12px; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; }
  .filed.none, .filed.away { opacity: 0; pointer-events: none; transform: translateY(-6px); }
  .hint { position: fixed; bottom: 66px; transform: translateX(-50%); font: 500 12px system-ui; color: var(--ink3); transition: opacity 0.6s ease; pointer-events: none; white-space: nowrap; }
  .tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    font: 500 12px/16px system-ui; opacity: 0; transition: opacity 0.12s ease; max-width: 260px; z-index: 5; }
  .tip .s { color: var(--ink2); font-weight: 400; }
  .toast { position: fixed; top: 20px; transform: translate(-50%, -8px); opacity: 0; padding: 8px 14px; border-radius: 12px; background: var(--ink); color: var(--bg);
    font: 500 12px system-ui; transition: opacity 0.2s ease, transform 0.25s var(--ease); pointer-events: none; z-index: 6; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- the panel: one sheet on the right, tabs on top, the ask field always at the bottom.
     Corners are concentric: sheet 26, padding 12, everything inside 14, a plate inside a 3 px track 11 */
  .panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 400px; border-radius: 26px; background: var(--sheet); box-shadow: var(--shadow);
    backdrop-filter: blur(30px) saturate(1.5); display: flex; flex-direction: column; overflow: hidden; }
  .phead { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0; }
  .tabs { position: relative; display: flex; padding: 3px; border-radius: 14px; background: var(--chip); }
  .tabs .plate { position: absolute; top: 3px; left: 0; height: 30px; border-radius: 11px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgb(0 0 0 / 0.08);
    transition: transform 0.36s var(--slide), width 0.36s var(--slide); }
  .tab { position: relative; height: 30px; padding: 0 14px; border: 0; background: transparent; color: var(--ink2); font: 500 13px system-ui; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: color 0.2s ease; }
  .tab[aria-selected='true'] { color: var(--ink); }
  .tab .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--bg); font: 600 11px/18px system-ui; font-variant-numeric: tabular-nums; }
  .tab .badge:empty { display: none; }
  .phead .when { font: 500 12px system-ui; color: var(--ink3); padding-right: 4px; font-variant-numeric: tabular-nums; }
  .views { position: relative; flex: 1; min-height: 0; }
  .view { position: absolute; inset: 0; overflow: auto; padding: 18px 12px 24px; scrollbar-width: none;
    transition: opacity 0.24s var(--ease), transform 0.36s var(--slide); }
  .view::-webkit-scrollbar { display: none; }
  .view.off { opacity: 0; pointer-events: none; transform: translateX(-14px); }
  .view.offr { opacity: 0; pointer-events: none; transform: translateX(22px); }
  .pfoot { flex: none; position: relative; padding: 0 12px 12px; }
  .pfoot::before { content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 28px; background: linear-gradient(to top, var(--sheet), transparent); pointer-events: none; }
  .askbar { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 6px 18px -10px rgb(0 0 0 / 0.25); }
  .askbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 14px system-ui; }
  .askbar input::placeholder { color: var(--ink3); }
  .askbar .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 9px; border-radius: 9px; background: var(--chip2); font: 500 12px system-ui; max-width: 150px; }
  .askbar .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .askbar .chip button { width: 18px; height: 18px; border: 0; border-radius: 9px; background: transparent; color: var(--ink2); cursor: pointer; line-height: 1; }
  .askbar .chip[hidden] { display: none; }
  .askbar .send { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; display: grid; place-items: center; transition: transform 0.12s ease, opacity 0.15s ease; }
  .askbar .send:active { transform: scale(0.94); }
  .askbar .send:disabled { opacity: 0.25; cursor: default; }
  .askbar kbd { flex: none; font: 500 11px/1 system-ui; color: var(--ink3); padding: 4px 7px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line); }
  .results { position: absolute; left: 12px; right: 12px; bottom: calc(100% - 4px); border-radius: 14px; padding: 4px; background: var(--card); box-shadow: var(--shadow);
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 0.16s ease, transform 0.22s var(--ease); }
  .results.open { opacity: 1; transform: none; pointer-events: auto; }
  .res { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 6px 10px; border-radius: 10px; cursor: pointer; }
  .res[aria-selected='true'], .res:hover { background: var(--chip); }
  .res .sh { flex: none; width: 9px; height: 9px; background: var(--ink); }
  .res .nm { flex: 1; min-width: 0; font-weight: 500; }
  .res .sn { display: block; font-size: 11.5px; line-height: 15px; color: var(--ink2); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .sn mark { background: none; color: var(--ink); font-weight: 600; }
  .res .kd { font-size: 12px; color: var(--ink2); }

  /* ---------- inside the panel */
  .wd { font: 500 12px/16px system-ui; color: var(--ink2); padding: 0 6px; }
  .filed[hidden] { display: none !important; }
  .date { font: 600 22px/28px system-ui; letter-spacing: -0.01em; margin-top: 4px; padding: 0 6px; }
  .sum.top { margin-top: 4px; margin-bottom: 4px; }
  .week.none { display: none; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 6px 8px; }
  .sec h3 { margin: 0; font: 600 13px/18px system-ui; }
  .sec .sub { font: 400 12px/16px system-ui; color: var(--ink2); }
  .sec .act { border: 0; background: transparent; color: var(--ink2); font: 500 12px system-ui; cursor: pointer; padding: 0; }
  .sec .act:hover { color: var(--ink); }
  .box { border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .line { position: relative; width: 352px; height: 54px; margin: 14px 6px 0; }
  .line .axis { position: absolute; left: 0; right: 0; top: 32px; height: 1px; background: var(--line); }
  .line .hr { position: absolute; top: 38px; font: 500 10px/12px system-ui; color: var(--ink3); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
  .line .bar { position: absolute; bottom: 22px; width: 3px; border-radius: 2px; background: var(--ink); opacity: 0.5; transform: translateX(-50%); }
  .line .call { position: absolute; top: 4px; height: 10px; border-radius: 5px; background: var(--ink); cursor: pointer; }
  .line .askd { position: absolute; top: 17px; width: 5px; height: 5px; border-radius: 3px; background: var(--pink); transform: translateX(-50%); }
  .line .nowl { position: absolute; top: 0; bottom: 18px; width: 1px; background: var(--pink); }
  .line .nowl::before { content: ''; position: absolute; top: -2px; left: -2.5px; width: 6px; height: 6px; border-radius: 3px; background: var(--pink); }
  .sum { font-size: 12px; line-height: 16px; color: var(--ink2); margin: 2px 6px 0; }
  .sum b { color: var(--ink); font-weight: 600; }
  .week { display: flex; gap: 4px; margin: 12px 2px 0; }
  .wk { flex: 1; padding: 6px 0 7px; border: 0; border-radius: 10px; text-align: center; cursor: pointer; background: transparent; transition: background 0.15s ease; }
  .wk:hover, .wk[aria-pressed='true'] { background: var(--chip); }
  .wk .l { font: 500 11px/14px system-ui; color: var(--ink2); }
  .wk.today .l { color: var(--ink); font-weight: 600; }
  .wk .bars { height: 18px; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; margin-top: 4px; }
  .wk .bars i { display: block; width: 14px; height: 3px; border-radius: 2px; background: var(--ink); opacity: 0.5; }
  .wk .bars.none::after { content: ''; width: 3px; height: 3px; border-radius: 2px; background: var(--ink3); }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; margin-top: 16px; border-radius: 14px; background: var(--chip); }
  .count { padding: 9px 8px 9px; border: 0; border-radius: 11px; background: transparent; cursor: pointer; text-align: left; transition: background 0.15s ease, transform 0.12s ease; }
  .count:hover { background: var(--chip); }
  .count:active { transform: scale(0.97); }
  .count[aria-pressed='true'] { background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgb(0 0 0 / 0.08); }
  .count .n { font: 600 19px/22px system-ui; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .count .t { font: 500 10.5px/13px system-ui; color: var(--ink2); margin-top: 2px; }
  .count.pink .n { color: var(--pink); }

  .it { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px 9px 8px; border-radius: 10px; }
  .box .it + .it { box-shadow: 0 -1px 0 var(--line); }
  .it .w { flex: 1; min-width: 0; }
  .it .what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .it a.what { text-decoration: none; }
  .it a.what:hover { text-decoration: underline; text-decoration-color: var(--ink3); text-underline-offset: 3px; }
  .it .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--ink2); }
  .it .meta .late { color: var(--pink); }
  .node-chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 0; border-radius: 6px; background: var(--chip); color: var(--ink); font: 500 11.5px system-ui; cursor: pointer; }
  .node-chip:hover { background: var(--chip2); }
  .node-chip .sh { width: 6px; height: 6px; background: currentColor; }
  .ck { flex: none; width: 20px; height: 20px; margin-top: -1px; border-radius: 10px; border: 0; background: transparent; color: transparent; cursor: pointer; display: grid; place-items: center;
    box-shadow: inset 0 0 0 1.5px var(--ink3); transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease; }
  .ck:hover { color: var(--ink2); box-shadow: inset 0 0 0 1.5px var(--ink2); }
  .ck.on { background: var(--ink); color: var(--bg); box-shadow: none; }
  .it.gone { opacity: 0; transition: opacity 0.2s ease, max-height 0.32s var(--ease) 0.12s, padding 0.32s var(--ease) 0.12s; max-height: 0 !important; padding-top: 0; padding-bottom: 0; overflow: hidden; }
  .dot { flex: none; width: 7px; height: 7px; margin: 6px 2px 0 4px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--ink3); }
  .dot.overdue { background: var(--pink); box-shadow: none; }
  .dot.due { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .dot.done { background: var(--ink3); box-shadow: none; }
  .wk { text-align: left; }
  .wk .what.closed { color: var(--ink2); }
  .wk .more { display: block; width: 100%; height: 36px; border: 0; background: transparent; color: var(--ink2); font: 500 12.5px system-ui; cursor: pointer; border-top: 1px solid var(--line); }
  .wk .more:hover { color: var(--ink); }
  .wk .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 6px; }

  /* review */
  .lede { margin: 2px 6px 0; font: 400 14px/20px system-ui; color: var(--ink2); }
  .lede b { color: var(--ink); font-weight: 600; }
  .grp { margin-top: 12px; overflow: hidden; transition: opacity 0.25s ease, max-height 0.4s var(--ease), margin 0.4s var(--ease); }
  .grp.gone { opacity: 0; max-height: 0 !important; margin-top: 0; }
  .ghead { display: flex; align-items: center; gap: 8px; padding: 11px 10px 9px 12px; }
  .ghead .src { flex: 1; min-width: 0; }
  .ghead .ttl { font: 600 13px/17px system-ui; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; text-decoration: none; }
  .ghead a.ttl:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink3); }
  .ghead .gk { font-size: 11.5px; color: var(--ink2); }
  .btn { height: 26px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--chip); color: var(--ink); font: 500 12px system-ui; cursor: pointer; white-space: nowrap; transition: background 0.15s ease, transform 0.12s ease; }
  .btn:hover { background: var(--chip2); }
  .btn:active { transform: scale(0.96); }
  .btn.dark { background: var(--ink); color: var(--bg); }
  .acts { flex: none; display: flex; gap: 4px; margin-top: -2px; }
  .ib { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--ink2); cursor: pointer; display: grid; place-items: center; transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease; }
  .ib:hover { background: var(--chip2); color: var(--ink); }
  .ib:active { transform: scale(0.92); }
  .ib.keep:hover { color: var(--ink); }
  .ngrp { margin-top: 12px; }
  .ngrp .ghd { display: flex; align-items: center; justify-content: space-between; margin: 0 6px 6px; }
  .ngrp .ghd .sub { font: 400 12px/16px system-ui; color: var(--ink2); }
  .ngrp .gname { font: 600 12px/20px system-ui; }
  .ft .it { cursor: pointer; }
  .ft .it[data-id] { cursor: default; }
  .ft .kind { margin-top: 2px; font: 400 12px/16px system-ui; color: var(--ink2); }
  .ft .kind.hot b { color: var(--pink); font-weight: 600; }
  .ft .more { display: none; }
  .ft .it.open .more { display: block; }
  .ft .it.open .what { display: block; -webkit-line-clamp: unset; overflow: visible; white-space: normal; }
  .ft .it:not(.open) .what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ft .acts { opacity: 0; transition: opacity 0.12s ease; }
  .ft .it:hover .acts, .ft .it.open .acts, .ft .it:focus-within .acts { opacity: 1; }
  .ft .move { margin-top: 5px; font-size: 12.5px; line-height: 18px; color: var(--ink); }
  .ft .move b { font-weight: 600; }
  .ft .seen { margin-top: 3px; font-size: 12px; line-height: 17px; color: var(--ink3); }
  .ft .seen a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .ft .dr { margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
  .ft .dr .quote { flex: 1; margin-top: 0; -webkit-line-clamp: 4; user-select: text; }
  .quote.two { -webkit-line-clamp: 2; }
  .quote { margin-top: 4px; padding-left: 9px; box-shadow: inset 2px 0 0 var(--line); color: var(--ink2); font-size: 12.5px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

<canvas id="c" tabindex="0" aria-label="Your brain as a dial. Every name keeps its place; the closer to the middle, the more it needs you. Arrow keys move, return flies into a name, slash asks."></canvas>

<nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="hint" id="hint" hidden></div>
<button class="filed" id="filed" hidden></button>
<div class="dock" id="dock">
  <div class="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="fit" aria-label="See everything">Fit</button><button id="zin" aria-label="Zoom in">+</button></div>
  <div class="pills" id="pills"></div>
  <div class="time"><button class="play" id="play" aria-label="Play the last seven weeks"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
    <span class="lbl">Rewind</span><input type="range" id="t" min="0" max="100" value="100" aria-label="Rewind to a day"><span class="when" id="when"></span></div>
</div>
<aside class="panel" id="panel">
  <div class="phead">
    <div class="tabs" role="tablist" id="tabs"><span class="plate" id="plate"></span>
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today<span class="badge" id="fbadge"></span></button>
      <button class="tab" role="tab" data-tab="week" aria-selected="false">Week</button>
      <button class="tab" role="tab" data-tab="review" aria-selected="false">Review<span class="badge" id="rbadge"></span></button>
    </div>
    <span class="when" id="asof"></span>
  </div>
  <div class="views">
    <section class="view" id="v-today" role="tabpanel"></section>
    <section class="view offr" id="v-week" role="tabpanel"></section>
    <section class="view offr" id="v-review" role="tabpanel"></section>
    <section class="view offr" id="v-node" aria-live="polite"></section>
    <section class="view offr" id="v-ask" aria-live="polite"></section>
    <section class="view offr" id="v-page" aria-live="polite"></section>
  </div>
  <div class="pfoot">
    <div class="results" id="results" role="listbox"></div>
    <div class="askbar"><span class="chip" id="chip" hidden><span id="chipt"></span><button aria-label="Ask about everything">×</button></span>
      <input id="q" placeholder="Ask Brain or find anything" autocomplete="off" aria-label="Ask Brain or find anything"><kbd id="kbd">/</kbd>
      <button class="send" id="send" aria-label="Ask Brain" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button></div>
  </div>
</aside>
<div class="kbar" id="kbar" role="dialog" aria-label="Command bar" hidden>
  <div class="kin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="kq" placeholder="Jump to anyone, or type done, ask" autocomplete="off" aria-label="Command" aria-controls="klist"><kbd>esc</kbd></div>
  <div class="klist" id="klist" role="listbox"></div>
  <div class="kfoot"><span><kbd>↵</kbd> go</span><span><b>done</b> close a row</span><span><b>ask</b> Brain</span></div>
</div>
<div class="tip" id="tip"></div>
<div class="qc" id="qc" role="dialog" aria-live="polite" hidden></div>
<section class="swp" id="sw" role="dialog" aria-label="Overdue sweep" hidden></section>
<script src="data.js"></script>
<script src="marked.js"></script>
<script>
(() => {
  const B = window.BRAIN
  const qs = new URLSearchParams(location.search)
  // ?still=1: everything in its place at once (for pictures; also what Reduce Motion gets)
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || qs.has('still')
  if (qs.get('theme')) document.documentElement.dataset.theme = qs.get('theme')
  if (qs.has('still')) document.documentElement.classList.add('still')
  const NATIVE = qs.has('native')
  // ?fakeask: a stand-in for Brain's channel, for pictures of the answer view only
  if (qs.has('fakeask')) window.webkit = { messageHandlers: { brain: { postMessage() {} } } }
  if (NATIVE) document.documentElement.classList.add('native')
  if (NATIVE && qs.has('clear')) document.documentElement.classList.add('clear')
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
  const $ = (id) => document.getElementById(id)
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
  const D = (s) => new Date(s + 'T12:00')
  const fmt = (d) => `${d.getDate()} ${MON[d.getMonth()]}`
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
  const today = D(B.today)
  const daysAgo = (s) => Math.round((today - D(s)) / 864e5)
  const between = (a, b) => Math.round((D(b) - D(a)) / 864e5)
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const KIND = { person: 'Person', project: 'Project', company: 'Company', topic: 'Topic', you: 'You' }
  const SHAPE = { person: 'border-radius:5px', company: 'border-radius:2px', project: 'border-radius:2.5px', topic: 'border-radius:5px;background:none;box-shadow:inset 0 0 0 1.5px currentColor' }
  const obs = (rel) => '#read:' + encodeURIComponent(rel)
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } }

  // ---------- the nodes, and how alive each was on a given day (the rewind): calls naming it in
  // the 14 days before, what was overdue by then, and today also what is open and written lately
  const byId = {}
  function actAt(n, t) {
    if (n.kind === 'you') return 1
    const met = (n.metDates || []).filter((d) => d <= t && between(d, t) <= 14).length
    const over = (n.dues || []).filter((d) => d < t).length
    const now = t === B.today
    return Math.min(1, met * 0.22 + (over ? 0.25 + over * 0.03 : 0) + (now ? (n.open || 0) * 0.07 + Math.max(0, 7 - daysAgo(n.lastTouched)) * 0.02 : 0))
  }
  const N = B.nodes.map((n) => {
    const o = { ...n, x: 0, y: 0, tx: 0, ty: 0, side: 1, show: 0, want: 0, hv: 0, label: n.title.replace(/\s*\(.*?\)/, ''), row: null }
    o.firstSeen = [o.born, ...(o.metDates || [])].sort()[0]
    o.act = actAt(o, B.today)
    byId[n.id] = o
    return o
  })
  const you = N.find((n) => n.kind === 'you')
  you.want = you.show = 1
  const E = B.edges.filter((e) => byId[e.a] && byId[e.b]).map((e) => ({ a: byId[e.a], b: byId[e.b], w: e.w }))
  const nbr = {}
  E.forEach((e) => { (nbr[e.a.id] ||= new Set()).add(e.b.id); (nbr[e.b.id] ||= new Set()).add(e.a.id) })
  // who and what a thing is close to: its wiki links, and twice as much, the calls they shared
  function neighbors(n) {
    const w = new Map()
    for (const id of nbr[n.id] || []) w.set(id, (w.get(id) || 0) + 1)
    for (const m of B.meetings) if (m.nodes.includes(n.id)) for (const id of m.nodes) if (id !== n.id) w.set(id, (w.get(id) || 0) + 2)
    return [...w.entries()].map(([id, k]) => ({ m: byId[id], k })).filter((x) => x.m && x.m !== you && (x.m.firstSeen || x.m.born) <= asOf)
      .sort((a, b) => b.k - a.k || b.m.act - a.m.act)
  }

  const ROW = 21, ST = [0.5, 0.7, 0.88], BAND = 0.036, LABEL = 12, GAP = 12, CORE = 24
  const TIERNAME = ['Needs you now', 'This week', 'Quiet']
  const on = { person: true, project: true, company: true, topic: false }
  let rows = { L: [], R: [] }, halfSpan = 200, R = 300
  const rim = (side, y) => ({ x: side * Math.sqrt(Math.max(0, R * R - y * y)), y })
  const byLabel = (a, b) => a.label.localeCompare(b.label)
  let heads = []
  const polar = (side, ang, r) => ({ x: side * Math.sin(ang) * r, y: -Math.cos(ang) * r })
  function dial() {
    N.forEach((n) => { n.row = null })
    const all = (k) => N.filter((n) => n.kind === k).sort(byLabel)
    heads = []
    for (const [groups, side] of [[[['People', all('person')]], -1], [[['Companies', all('company')], ['Projects', all('project')]], 1]]) {
      const slots = groups.reduce((s, g) => s + g[1].length, 0) + (groups.length - 1) * 1.5
      const A0 = 0.09 * Math.PI, A1 = 0.91 * Math.PI, at = (k) => A0 + ((A1 - A0) * k) / Math.max(1, slots - 1)
      let k = 0, i = 0
      for (const [title, list] of groups) {
        heads.push({ side, ang: at(k), text: title, count: list.length })
        list.forEach((n) => { n.row = { ang: at(k), odd: i % 2, side }; n.side = side; k++; i++ })
        k += 1.5
      }
    }
    R = 520
  }
  function tiers() {
    // by rank, not threshold: the inner ring holds the few that matter most on each side
    for (const side of [-1, 1]) {
      const list = N.filter((n) => n !== you && n.row && n.want && n.side === side)
      const ranked = [...list].sort((a, b) => b.act - a.act || (b.overdue || 0) - (a.overdue || 0) || byLabel(a, b))
      const t0n = Math.min(8, Math.ceil(ranked.length * 0.28)), t1n = Math.ceil(ranked.length * 0.36)
      ranked.forEach((n, i) => { n.tierNow = i < t0n ? 0 : i < t0n + t1n ? 1 : 2 })
    }
    // the web inside: who and what met together in the two weeks before, and links between the near ones
    const pairs = new Map()
    const add = (a, b, w) => { if (!a || !b || a === b || !a.row || !b.row || !a.want || !b.want) return; const k = a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; const p = pairs.get(k) || { a, b, w: 0 }; p.w += w; pairs.set(k, p) }
    for (const m of B.meetings) if (m.date <= asOf && between(m.date, asOf) <= 14) { const ns = m.nodes.slice(0, 10).map((id) => byId[id]); ns.forEach((a, i) => ns.slice(i + 1).forEach((b) => add(a, b, 1))) }
    for (const e of E) if ((e.a.tierNow ?? 2) === 0 && (e.b.tierNow ?? 2) === 0) add(e.a, e.b, 0.5)
    web = [...pairs.values()].sort((p, q) => q.w - p.w).slice(0, 180)
  }
  let web = []
  // each ring is a band: neighbours on the rim sit a little in or out, so their dots never touch
  const home = (n) => n.row ? polar(n.side, n.row.ang, (ST[n.tierNow ?? 2] + (n.row.odd ? BAND : -BAND) * 0.8) * R) : { x: 0, y: 0 }

  // ---------- flying into a name: it stays where it is, the camera comes close, and the people
  // and things it is close to gather around it (people on its left, the rest on its right). Hop
  // from one to the next; the trail at the top walks back. Leaving, everyone flies home.
  let trail = [], egoN = null, egoK = 0
  const egoPos = new Map()
  const ER = 230
  function gather(n) {
    egoPos.clear(); egoN = n
    if (!n) return
    const F = home(n)
    const list = neighbors(n).slice(0, 14)
    const left = list.filter((x) => x.m.kind === 'person').sort((a, b) => byLabel(a.m, b.m))
    const right = list.filter((x) => x.m.kind !== 'person').sort((a, b) => byLabel(a.m, b.m))
    const spread = (arr, a0, a1) => arr.forEach((x, i) => {
      const a = arr.length === 1 ? (a0 + a1) / 2 : a0 + ((a1 - a0) * i) / (arr.length - 1)
      egoPos.set(x.m, { x: F.x + Math.cos(a) * ER * 1.3, y: F.y + Math.sin(a) * ER, k: x.k, side: Math.cos(a) < 0 ? -1 : 1 })
    })
    const wideL = left.length > 7 ? 0.42 : 0.3, wideR = right.length > 7 ? 0.42 : 0.3
    spread(left, Math.PI * (1 + wideL), Math.PI * (1 - wideL))
    spread(right, -Math.PI * wideR, Math.PI * wideR)
  }
  function place() {
    for (const n of N) {
      if (n === you) continue
      const p = egoPos.get(n)
      if (p) { n.tx = p.x; n.ty = p.y } else { const h = home(n); n.tx = h.x; n.ty = h.y }
      if (!n.placed) { n.x = n.tx * 0.6; n.y = n.ty; n.placed = true }
      const known = (n.firstSeen || n.born) <= asOf
      n.want = known && ((n.row && on[n.kind]) || egoPos.has(n)) ? 1 : 0
    }
  }

  // ---------- the stage: the map's room is the window minus the panel
  const cv = $('c'), cx = cv.getContext('2d')
  let W = 0, H = 0, dpr = 1, wide = true
  const stage = { w: 0, h: 0, cx: 0, cy: 0 }
  const cam = { x: 0, y: 0, z: 1 }, camTo = { x: 0, y: 0, z: 1 }
  let homeZ = 1, fitZ = 1, moved = false
  function measure() {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr
    wide = W >= 900
    stage.w = wide ? W - 424 : W; stage.h = wide ? H : H * 0.54 - 8
    stage.cx = stage.w / 2; stage.cy = stage.h / 2 - (wide ? 6 : 0)
    fitZ = Math.max(0.3, Math.min(1.3, Math.min((stage.w - 60) / (2 * (R + 90)), (stage.h - 150) / (2 * R + 110))))
    // home is a little closer than fitting it all: the edges run off the screen, there is more to walk to
    homeZ = fitZ * 1.18
    for (const el of [$('dock'), $('hint'), $('toast'), $('sw')]) el.style.left = stage.cx + 'px'
    aim()
  }
  addEventListener('resize', measure)
  function aim() {
    if (egoN) {
      const F = home(egoN)
      camTo.x = F.x; camTo.y = F.y
      // close enough to read, never so close the gathered names leave the room (names are 12 px at any zoom)
      camTo.z = Math.max(0.8, Math.min(1.7, (stage.w / 2 - 215) / (ER * 1.3), (stage.h / 2 - 110) / ER))
    } else if (!moved) { camTo.x = 0; camTo.y = 0; camTo.z = homeZ }
  }
  const S = (x, y) => [stage.cx + (x - cam.x) * cam.z, stage.cy + (y - cam.y) * cam.z]

  // ---------- input on the map
  let hover = null, drag = null, lit = null, litLabel = '', kb = null
  function hit(px, py) {
    let best = null, bd = Infinity
    for (const n of N) {
      if (n.show < 0.5) continue
      for (const b of [n.box, n.dbox]) if (b && px >= b.x0 && px <= b.x1 && py >= b.y0 && py <= b.y1) { const d = Math.abs(py - (b.y0 + b.y1) / 2); if (d < bd) { bd = d; best = n } }
    }
    return best
  }
  cv.addEventListener('pointermove', (e) => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y
      if (Math.hypot(dx, dy) > 3) drag.moved = true
      if (drag.moved) { moved = true; cam.x = camTo.x = drag.cx - dx / cam.z; cam.y = camTo.y = drag.cy - dy / cam.z }
      return
    }
    const h = hit(e.clientX, e.clientY)
    if (h !== hover) { hover = h; tipFor(h) }
    if (h) moveTip(e)
    cv.style.cursor = h ? 'pointer' : 'default'
  })
  cv.addEventListener('pointerleave', () => { hover = null; tipFor(null) })
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false }; seen() })
  addEventListener('pointerup', (e) => {
    cv.classList.remove('dragging')
    if (drag && !drag.moved && e.target === cv) { const n = hit(e.clientX, e.clientY); if (egoN) { if (n) fly(n, true) } else quick(n && n !== quickN ? n : null) }
    drag = null
  })
  // walk it like Figma: two fingers move you any way, a pinch (or cmd + scroll) zooms where you point
  function zoomAt(px, py, k) {
    const wx = (px - stage.cx) / cam.z + cam.x, wy = (py - stage.cy) / cam.z + cam.y
    moved = true; cam.z = camTo.z = Math.max(fitZ * 0.5, Math.min(4, cam.z * k))
    cam.x = camTo.x = wx - (px - stage.cx) / cam.z; cam.y = camTo.y = wy - (py - stage.cy) / cam.z
  }
  cv.addEventListener('wheel', (e) => {
    e.preventDefault(); seen()
    if (e.ctrlKey || e.metaKey) return zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.003)))
    moved = true; cam.x = camTo.x = cam.x + e.deltaX / cam.z; cam.y = camTo.y = cam.y + e.deltaY / cam.z
  }, { passive: false })
  $('zin').addEventListener('click', () => zoomAt(stage.cx, stage.cy, 1.4))
  $('zout').addEventListener('click', () => zoomAt(stage.cx, stage.cy, 1 / 1.4))
  $('fit').addEventListener('click', () => { if (egoN) fly(null); camTo.x = 0; camTo.y = 0; camTo.z = fitZ })
  addEventListener('keydown', (e) => {
    if (document.activeElement === q || document.activeElement?.id === 'kq') return
    if (e.key === '=' || e.key === '+') zoomAt(stage.cx, stage.cy, 1.4)
    if (e.key === '-') zoomAt(stage.cx, stage.cy, 1 / 1.4)
    if (e.key === '0') { camTo.x = 0; camTo.y = 0; camTo.z = fitZ }
  })
  cv.addEventListener('dblclick', (e) => { if (!hit(e.clientX, e.clientY)) fly(null) })

  // fly(n, hop): into a name (a hop from the one you are in adds to the trail), or home with null
  function fly(n, hop) {
    if (n === you) n = null
    if (!n) { trail = []; moved = false }
    else if (hop && egoN) { const i = trail.indexOf(n); trail = i >= 0 ? trail.slice(0, i + 1) : [...trail, n] }
    else trail = [n]
    gather(n); place(); aim(); lightOff(); showNode(n); crumbs(); seen()
    $('filed').classList.toggle('away', !!n)
    kb = n || kb
  }
  function crumbs() {
    const el = $('crumbs')
    el.classList.toggle('on', trail.length > 0)
    if (!trail.length) return
    el.innerHTML = `<button data-i="-1" class="home"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="10" width="4.5" height="4.5" rx="1.4"/><rect x="9.8" y="4" width="4.5" height="4.5" rx="1.4"/><rect x="9.8" y="10" width="4.5" height="4.5" rx="1.4"/><rect x="9.8" y="16" width="4.5" height="4.5" rx="1.4"/><rect x="16.6" y="10" width="4.5" height="4.5" rx="1.4"/></svg>Brain</button>` +
      trail.map((n, i) => `<span class="sep">›</span><button data-i="${i}">${esc(n.label)}</button>`).join('')
  }
  $('crumbs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return
    const i = +b.dataset.i
    if (i < 0) return fly(null)
    trail = trail.slice(0, i + 1); const n = trail[i]
    gather(n); place(); aim(); showNode(n); crumbs()
  })

  // ---------- which kinds show, and since when
  const pills = $('pills')
  pills.innerHTML = [['person', 'People'], ['project', 'Projects'], ['company', 'Companies']].map(([k, l]) => `<button class="pill" data-k="${k}" aria-pressed="${on[k]}"><span class="sw" style="${SHAPE[k]}"></span>${l}</button>`).join('')
  pills.addEventListener('click', (e) => { const b = e.target.closest('.pill'); if (!b) return; on[b.dataset.k] = !on[b.dataset.k]; b.setAttribute('aria-pressed', on[b.dataset.k]); relayout(true) })
  const t0 = D([...B.nodes.map((n) => n.born), ...B.meetings.map((m) => m.date)].reduce((m, d) => (d < m ? d : m), B.today)), span = Math.max(1, Math.round((today - t0) / 864e5))
  const tEl = $('t'), whenEl = $('when')
  tEl.max = span; tEl.value = span
  let shownTo = span, asOf = B.today
  function relayout(rows) {
    asOf = shownTo >= span ? B.today : iso(new Date(t0.getTime() + shownTo * 864e5))
    N.forEach((n) => { if (n !== you) { n.act = actAt(n, asOf); n.met = (n.metDates || []).filter((d) => d <= asOf && between(d, asOf) <= 14).length } })
    if (rows) { dial(); measure() }
    place(); tiers(); if (egoN) gather(egoN); place(); mirror()
    $('asof').textContent = asOf === B.today ? '' : 'as of ' + fmt(D(asOf))
  }
  function setTime(v) {
    const was = shownTo
    shownTo = Math.round(+v); const d = new Date(t0); d.setDate(t0.getDate() + shownTo)
    whenEl.textContent = shownTo >= span ? 'Today' : fmt(d)
    if (shownTo !== was) relayout(false)
  }
  tEl.addEventListener('input', () => { setTime(tEl.value); seen() })
  let playing = null
  $('play').addEventListener('click', () => {
    if (playing) { cancelAnimationFrame(playing); playing = null; return }
    let v = 0, last = performance.now()
    const step = (now) => { v = Math.min(span, v + ((now - last) / 7000) * span); last = now; tEl.value = v; setTime(v); playing = v < span ? requestAnimationFrame(step) : null }
    playing = requestAnimationFrame(step)
  })

  // ---------- the panel: tabs with a plate that slides, views that slide, a node pushed over them
  let tab = ['review', 'week'].includes(qs.get('tab')) ? qs.get('tab') : 'today'
  const tabsEl = $('tabs'), plate = $('plate')
  function setTab(t, quiet) {
    tab = t
    tabsEl.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === t))
    const b = tabsEl.querySelector(`[data-tab="${t}"]`)
    plate.style.width = b.offsetWidth + 'px'; plate.style.transform = `translateX(${b.offsetLeft}px)`
    if (!quiet && egoN) fly(null)
    views()
  }
  tabsEl.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab) })
  // a view left of the one shown waits on the left, one right of it on the right; a name pushes
  // the tab it came from out to the left
  const ORDER = ['today', 'week', 'review']
  function views() {

      ${WK.slipped.length ? `<div class="sec"><h3>Slipped</h3><span class="sub">due this week, not seen done</span></div><div class="box">${WK.slipped.map((r) => wkRow(r, 'overdue')).join('')}</div>` : ''}
      ${cold.length ? `<div class="sec"><h3>Going cold</h3><span class="sub">you owe them, no contact in 2 weeks</span></div><div class="chips">${cold.map(chip).join('')}</div>` : ''}
      ${WK.closed.length ? `<div class="sec"><h3>Closed</h3><span class="sub">yours first</span></div><div class="box">${shown.map((r) => wkRow(r, 'done')).join('')}
        ${WK.closed.length > 6 ? `<button class="more" id="wkmore">${wkAll ? 'Show fewer' : `Show all ${WK.closed.length}`}</button>` : ''}</div>` : ''}</div>`
  }
  $('v-week').addEventListener('click', (e) => { if (e.target.closest('#wkmore')) { wkAll = !wkAll; renderWeek() } })
  function counts() {
    const nP = left(), nW = pagesLeft()

  $('v-review').addEventListener('click', (e) => {
    const k = e.target.closest('[data-keep]'), d = e.target.closest('[data-drop]'), all = e.target.closest('[data-keepall]'), rd = e.target.closest('[data-read]')
    const done = (ids, v) => {
      ids.forEach((id) => reviewed.add(id)); remember(); send(v, ids)
      toast(v === 'keep' ? (ids.length > 1 ? `Kept ${ids.length}` : 'Kept') + ' in your ledger' : 'Dropped, it was not a promise')
    }
    const settle = (row) => {
      const grp = row.closest('.grp')
      gone(row, () => { row.remove(); if (grp && !grp.querySelector('.it')) gone(grp, () => { grp.remove(); after() }); else after() })
    }
    const after = () => { counts(); if (!left() && !pagesLeft()) renderReview(); else { const l = $('v-review').querySelector('.lede'); if (l) { const g = $('v-review').querySelectorAll('.grp').length, nP = left(), nW = pagesLeft(); l.innerHTML = `Since yesterday Brain heard <b>${nP} promise${nP === 1 ? '' : 's'}</b> in ${g} place${g === 1 ? '' : 's'} and wrote on <b>${nW} page${nW === 1 ? '' : 's'}</b>. Keep what is right, drop what was never a promise.` } } }
    if (k) { done([k.dataset.keep], 'keep'); settle(k.closest('.it')) }
    if (d) { done([d.dataset.drop], 'drop'); settle(d.closest('.it')) }
    if (all) {
      const grp = all.closest('.grp'); const ids = [...grp.querySelectorAll('.it[data-id]')].map((x) => x.dataset.id)
      done(ids, 'keep'); gone(grp, () => { grp.remove(); after() })
    }
    if (rd) { readPages.add(rd.dataset.read); remember(); settle(rd.closest('.it')) }
  })

  // ---------- a node, pushed over the tab: what it is now, its weeks as a line, what is owed,
  // its calls, who and what it is close to
  function showNode(n) {
    views()
    $('chip').hidden = !n; $('chipt').textContent = n ? n.label : ''
    q.placeholder = n ? `Ask about ${n.label.split(' ')[0]}` : 'Ask Brain or find anything'
    if (!n) return
    const first = n.label.split(' ')[0]
    const cold = n.kind === 'person' && n.contact && daysAgo(n.contact) > 14 && (n.mine || []).length
    // eight weeks back, two ahead: calls as bars, what you owe as dots on its date, today in pink
    const a = new Date(today); a.setDate(a.getDate() - 56)
    const TL = 352, span2 = 70, P = (s) => (Math.max(0, Math.min(span2, between(iso(a), s))) / span2) * TL
    const mondays = [...Array(11)].map((_, i) => { const d = new Date(a); d.setDate(a.getDate() + ((8 - a.getDay()) % 7) + i * 7); return d }).filter((d) => between(iso(a), iso(d)) <= span2)
    const contactBar = n.contact && !(n.metDates || []).includes(n.contact) && n.contact >= iso(a) ? `<i class="cl soft" style="left:${P(n.contact)}px" title="last contact ${fmt(D(n.contact))}"></i>` : ''
    const tl = `<div class="sec"><h3>Ten weeks</h3><span class="sub"><i class="lgc"></i>calls <i class="lgd"></i>what you owe</span></div><div class="tl" aria-hidden="true"><div class="ax"></div>${contactBar}
      ${mondays.map((d, i) => `<i class="wkt" style="left:${P(iso(d))}px"></i>${i % 2 === 0 ? `<span class="wl" style="left:${P(iso(d))}px">${fmt(d)}</span>` : ''}`).join('')}
      ${(n.metDates || []).filter((d) => d >= iso(a)).map((d) => `<i class="cl" style="left:${P(d)}px" title="call ${fmt(D(d))}"></i>`).join('')}
      ${(n.mine || []).filter((r) => r.due).map((r) => `<i class="du ${r.state}" style="left:${P(r.due)}px" title="${esc(r.what)}"></i>`).join('')}
      <i class="td" style="left:${P(B.today)}px"></i></div>`
    const items = (list) => `<div class="box">${list.map((r) => `<div class="it" data-id="${r.id}"><button class="ck" data-done="${r.id}" aria-label="Done: ${esc(r.what)}">${ckSvg}</button>
      <div class="w"><a class="what" href="${obs(r.source)}">${esc(r.what)}</a><div class="meta"><span class="${r.state === 'overdue' ? 'late' : ''}">${r.due ? (r.state === 'overdue' ? 'since ' : 'by ') + fmt(D(r.due)) : 'no date'}</span></div></div></div>`).join('')}</div>`
    const nb = neighbors(n).slice(0, 14)
    $('v-node').innerHTML = `<div class="ntop"><button class="back" id="back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>${trail.length > 1 ? esc(trail[trail.length - 2].label) : ({ review: 'Review', week: 'Week' })[tab] || 'Today'}</button>
        <a class="openp" href="${obs('wiki/' + n.id + '.md')}">Open page ↗</a></div>
      <div class="kind">${KIND[n.kind]} · ${TIERNAME[n.tierNow ?? 2].toLowerCase()}</div>
      <div class="nname">${esc(n.title)}</div>
      <div class="nmeta">${n.last ? 'Last contact ' + esc(n.last) : n.contact ? 'Last met ' + fmt(D(n.contact)) : 'Written about ' + (daysAgo(n.lastTouched) === 0 ? 'today' : fmt(D(n.lastTouched)))}${cold ? ' · <span class="late">going cold</span>' : ''}</div>
      ${n.now ? `<p class="nowp">${esc(n.now)}</p>` : ''}
      ${tl}
      ${(n.mine || []).length ? `<div class="sec"><h3>You owe${n.kind === 'person' ? ' ' + esc(first) : ''}</h3><span class="sub">${n.mine.length}${n.overdue ? ` · <span style="color:var(--pink)">${n.overdue} overdue</span>` : ''}</span></div>${items(n.mine)}` : ''}
      ${(n.theirs || []).length ? `<div class="sec"><h3>${n.kind === 'person' ? esc(first) + ' owes you' : 'Owed to you'}</h3><span class="sub">${n.theirs.length}</span></div>${items(n.theirs)}` : ''}
      ${(n.meetings || []).length ? `<div class="sec"><h3>Calls</h3><span class="sub">${n.meetings.length}</span></div><div class="box">${n.meetings.map((m) => `<div class="it"><span class="dot"></span><div class="w"><a class="what" href="${obs(m.file)}">${esc(m.title)}</a></div><span class="meta" style="margin:0">${fmt(D(m.date))}${m.start ? ' ' + m.start : ''}</span></div>`).join('')}</div>` : ''}
      ${nb.length ? `<div class="sec"><h3>Close to ${n.kind === 'person' ? esc(first) : 'it'}</h3><span class="sub">links and shared calls</span></div><div class="conn">${nb.map((x) => `<button class="node-chip" data-fly="${x.m.id}"><span class="sh" style="${SHAPE[x.m.kind]}"></span>${esc(x.m.label)}</button>`).join('')}</div>` : ''}`
    $('v-node').scrollTop = 0
  }
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-fly]'); if (c) { fly(byId[c.dataset.fly], !!egoN); return }
    if (e.target.closest('#back')) { if (trail.length > 1) { trail.pop(); const n = trail[trail.length - 1]; gather(n); place(); aim(); showNode(n); crumbs() } else fly(null) }
    const ok = e.target.closest('[data-done]')
    if (ok && !ok.classList.contains('on')) {
      ok.classList.add('on'); send('done', [ok.dataset.done]); toast('Done, in your ledger')
      const it = ok.closest('.it'); setTimeout(() => gone(it, () => it.remove()), reduce ? 0 : 500)
    }
  })

  // ---------- ask or find: one field at the bottom of the panel, about the name you are in
  const q = $('q'), resEl = $('results'), sendB = $('send')
  let results = [], pick = 0
  function showResults() {
    resEl.innerHTML = results.map((n, i) => `<div class="res" role="option" data-id="${n.id}" aria-selected="${i === pick}"><span class="sh" style="${SHAPE[n.kind] || ''}"></span><span class="nm">${esc(n.label)}${n.snip ? `<span class="sn">${n.snip}</span>` : ''}</span><span class="kd">${KIND[n.kind]}</span></div>`).join('')

  }
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase()
    sendB.disabled = !v; $('kbd').style.display = v ? 'none' : ''
    const inName = (n) => n.label.toLowerCase().includes(v) || n.id.includes(v)
    results = v && !egoN ? N.filter((n) => n !== you && (inName(n) || (v.length > 2 && (n.text || '').toLowerCase().includes(v))))
      .sort((a, b) => (inName(b) - inName(a)) || (b.label.toLowerCase().startsWith(v) - a.label.toLowerCase().startsWith(v)) || b.act - a.act).slice(0, 6) : []
    results.forEach((n) => {
      const t = n.text || '', i = t.toLowerCase().indexOf(v)
      n.snip = !inName(n) && i >= 0 ? (i > 30 ? '…' : '') + esc(t.slice(Math.max(0, i - 30), i)) + '<mark>' + esc(t.slice(i, i + v.length)) + '</mark>' + esc(t.slice(i + v.length, i + v.length + 50)) + '…' : ''
    })
    pick = 0
    if (!egoN) { lit = results.length ? new Set(results.map((n) => n.id)) : null; litLabel = results.length ? `“${q.value.trim()}”` : '' }
    showResults()
  })
  function ask() {
    const text = q.value.trim(); if (!text) return
    if (CAN_ASK) { homeAsk(egoN && !convo.open ? `About ${egoN.title}: ${text}` : text); q.value = ''; q.dispatchEvent(new Event('input')); return }
    location.href = 'brain://ask?q=' + encodeURIComponent(egoN ? `About ${egoN.title}: ${text}` : text)
    toast(egoN ? `Asked Brain about ${egoN.label.split(' ')[0]}, the answer opens in the notch` : 'Asked Brain, the answer opens in the notch')
    q.value = ''; q.dispatchEvent(new Event('input'))
  }
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!results.length) return; e.preventDefault(); pick = (pick + (e.key === 'ArrowDown' ? 1 : results.length - 1)) % results.length; showResults(); return }
    if (e.key !== 'Enter') return
    if (results[pick]) { const n = results[pick]; q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); fly(n); return }
    ask()
  })
  sendB.addEventListener('click', ask)
  resEl.addEventListener('click', (e) => { const r = e.target.closest('.res'); if (r) { q.value = ''; q.dispatchEvent(new Event('input')); fly(byId[r.dataset.id]) } })
  $('chip').querySelector('button').addEventListener('click', () => fly(null))

  // ---------- ⌘K: one box for everything. Names jump on the map, the tabs and the sweep open,
  // "ask …" asks Brain, "done …" closes a row.
  const kbar = $('kbar'), kq = $('kq'), klist = $('klist')
  const KROWS = (() => { const m = new Map(); N.forEach((n) => [...(n.mine || []), ...(n.theirs || [])].forEach((r) => { if (!m.has(r.id)) m.set(r.id, { ...r, node: n }) })); return [...m.values()] })()
  const CMDS = [
    { t: 'Sweep', k: 'S', i: '↻', go: () => SW.some((x) => !x.gone) ? sweep(true) : toast('Nothing to sweep') },
    { t: 'Today', i: '◷', go: () => setTab('today') }, { t: 'Week', i: '▦', go: () => setTab('week') }, { t: 'Review', i: '✓', go: () => setTab('review') },
    { t: 'See the whole map', i: '◎', go: () => { if (egoN) fly(null); $('fit').click() } },
  ]
  let kitems = [], kpick = 0
  const kwho = (r) => isMe(r.owes) ? `you owe ${(r.to || '').split(/[ ,]/)[0]}` : `${(r.owes || '').split(/[ ,]/)[0]} owes ${isMe(r.to) ? 'you' : (r.to || '').split(/[ ,]/)[0]}`
  function kfill() {
    const raw = kq.value.trim(), m = raw.match(/^(done|ask)\b\s*(.*)$/i), mode = m ? m[1].toLowerCase() : '', v = (m ? m[2] : raw).toLowerCase()
    const hit = (s) => !v || s.toLowerCase().includes(v)
    const rowItem = (r, how) => ({ g: how === 'done' ? 'Mark done' : 'Promises', h: `<span class="ki">${how === 'done' ? '✓' : '·'}</span><span class="kt">${esc(r.what)}<small>${esc(kwho(r))}</small></span><span class="kk ${r.state === 'overdue' ? 'late' : ''}">${r.due ? fmt(D(r.due)) : ''}</span>`,
      go: () => how === 'done' ? (send('done', [r.id]), settle(r.id, 'done'), toast('Done, in your ledger'), renderToday()) : fly(r.node) })
    const rows = (how) => KROWS.filter((r) => hit(r.what + ' ' + r.owes + ' ' + r.to)).sort((a, b) => ({ overdue: 0, due: 1, open: 2 })[a.state] - ({ overdue: 0, due: 1, open: 2 })[b.state]).slice(0, 12).map((r) => rowItem(r, how))
    if (mode === 'ask') kitems = [{ g: 'Ask Brain', h: `<span class="ki">?</span><span class="kt">${v ? esc(m[2]) : 'Type the question'}</span><span class="kk">↵</span>`, go: () => { if (!m[2]) return 'stay'; q.value = m[2]; ask() } }]
    else if (mode) kitems = rows(mode)
    else {
      const names = N.filter((n) => n !== you && hit(n.label + ' ' + n.title)).sort((a, b) => (b.overdue || 0) - (a.overdue || 0) || b.act - a.act).slice(0, raw ? 8 : 5)
        .map((n) => ({ g: 'People and projects', h: `<span class="sh" style="${SHAPE[n.kind] || ''}"></span><span class="kt">${esc(n.title)}</span><span class="kk ${n.overdue ? 'late' : ''}">${n.overdue ? n.overdue + ' overdue' : KIND[n.kind]}</span>`, go: () => fly(n) }))
      const cmds = CMDS.filter((c) => hit(c.t)).map((c) => ({ g: 'Go', h: `<span class="ki">${c.i}</span><span class="kt">${esc(c.t)}</span><span class="kk">${c.k || ''}</span>`, go: c.go }))
      kitems = [...cmds, ...names, ...(raw ? rows('') .slice(0, 5) : []), ...(raw.length > 3 ? [{ g: 'Ask Brain', h: `<span class="ki">?</span><span class="kt">${esc(raw)}</span><span class="kk">ask</span>`, go: () => { q.value = raw; ask() } }] : [])]
    }
    kpick = Math.min(kpick, Math.max(0, kitems.length - 1))
    let g = ''
    klist.innerHTML = kitems.map((it, i) => (it.g !== g ? `<div class="kgrp">${(g = it.g)}</div>` : '') + `<div class="kit" role="option" data-k="${i}" aria-selected="${i === kpick}">${it.h}</div>`).join('') || '<div class="kempty">Nothing by that name. Type ask and the question to ask Brain.</div>'
    klist.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' })
  }
  function kopen(on) {
    if (on) { kbar.hidden = false; kq.value = ''; kpick = 0; kfill(); kq.focus() } else { kbar.hidden = true; kq.blur() }
  }
  function krun(i) { const it = kitems[i]; if (!it) return; if (it.go() !== 'stay') kopen(false) }
  kq.addEventListener('input', () => { kpick = 0; kfill() })
  kq.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (kitems.length) { kpick = (kpick + (e.key === 'ArrowDown' ? 1 : kitems.length - 1)) % kitems.length; kfill() } }
    else if (e.key === 'Enter') { e.preventDefault(); krun(kpick) }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); kopen(false) }
  })
  klist.addEventListener('click', (e) => { const it = e.target.closest('.kit'); if (it) krun(+it.dataset.k) })
  document.addEventListener('mousedown', (e) => { if (!kbar.hidden && !kbar.contains(e.target)) kopen(false) })
  addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); e.stopImmediatePropagation(); kopen(kbar.hidden) } }, true)
  if (qs.has('kbar')) setTimeout(() => { kopen(true); if (qs.get('kbar')) { kq.value = qs.get('kbar'); kfill() } }, 60)

  // ---------- keys: arrows walk the rows (in a name, its neighbors), return flies, escape walks back
  function step(dir) {
    const vis = N.filter((n) => n !== you && n.show > 0.5 && (!egoN || egoPos.has(n)))
    if (!vis.length) return
    const from = kb && vis.includes(kb) ? kb : null
    if (!from) { kb = vis.sort((a, b) => a.ty - b.ty)[0]; hover = kb; return }
    const Y = (n) => n.ty
    const cand = vis.filter((n) => n !== from && (dir === 'up' ? Y(n) < Y(from) - 1 : dir === 'down' ? Y(n) > Y(from) + 1 : dir === 'left' ? n.tx < from.tx - 1 : n.tx > from.tx + 1))
    const cost = (n) => dir === 'up' || dir === 'down' ? Math.abs(Y(n) - Y(from)) + Math.abs(n.tx - from.tx) * 0.2 + (Math.sign(n.tx) !== Math.sign(from.tx) ? 1e4 : 0) : Math.abs(Y(n) - Y(from)) * 3 + Math.abs(n.tx - from.tx) * 0.1
    const next = cand.sort((a, b) => cost(a) - cost(b))[0]
    if (next) { kb = next; hover = next; tipFor(null) }
  }
  cv.addEventListener('keydown', (e) => {
    const k = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key]
    if (k) { e.preventDefault(); step(k); seen() }
    if (e.key === 'Enter' && kb) { fly(kb, !!egoN); seen() }
  })
  addEventListener('keydown', (e) => {
    if (!kbar.hidden) return
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); seen() }
    if (e.key === 'Escape') {
      if (results.length) { q.value = ''; q.dispatchEvent(new Event('input')); return }
      if (quickN) return quick(null)
      if (reader.stack.length) return pageBack()
      if (convo.open) return closeAsk()
      if (trail.length > 1) { trail.pop(); const n = trail[trail.length - 1]; gather(n); place(); aim(); showNode(n); crumbs(); return }
      if (egoN) return fly(null)
      lightOff(); q.blur()
    }
  })
  const sr = $('sr')
  function mirror() {
    sr.innerHTML = N.filter((n) => n !== you && n.want).sort((a, b) => (a.tierNow ?? 2) - (b.tierNow ?? 2) || byLabel(a, b)).map((n) => `<li><button data-fly="${n.id}">${esc(n.title)}, ${KIND[n.kind].toLowerCase()}, ${TIERNAME[n.tierNow ?? 2].toLowerCase()}${(n.mine || []).length ? `, you owe ${n.mine.length}` : ''}${(n.theirs || []).length ? `, owed to you ${n.theirs.length}` : ''}${n.overdue ? `, ${n.overdue} overdue` : ''}</button></li>`).join('')
  }
  const toastEl = $('toast')
  let toastT = 0
  function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200) }
  const hintEl = $('hint')
  let hintSeen = store.get('brain-home-hint-7', false)
  if (hintSeen) hintEl.style.opacity = 0
  function seen() { if (hintSeen) return; hintSeen = true; hintEl.style.opacity = 0; store.set('brain-home-hint-7', true) }
  const tip = $('tip')
  function tipFor(n) {
    if (true) { tip.style.opacity = 0; return }
    const bits = [KIND[n.kind], TIERNAME[n.tierNow ?? 2].toLowerCase(), n.overdue ? `${n.overdue} overdue` : '', n.met ? `${n.met} call${n.met > 1 ? 's' : ''} in 2 weeks` : ''].filter(Boolean)
    tip.innerHTML = `${esc(n.title)}<div class="s">${bits.join(' · ')}</div>`; tip.style.opacity = 1
  }
  function moveTip(e) { tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px' }

  let quickN = null, quickSide = 1
  const qc = $('qc')
  const roleOf = (n) => {
    let t = (n.now || '').replace(/\s+/g, ' ').replace(/\([^)]*\)/g, '').replace(/\S+@\S+/g, '').replace(/\s+([,.])/g, '$1').trim()
    const f = (t.match(/^.*?[.!?](\s|$)/) || [t])[0].trim()
    return f.length > 160 ? f.slice(0, 158).replace(/[ ,;:][^ ,;:]*$/, '') + '…' : f
  }
  function quick(n) {
    quickN = n
    if (!n) { qc.classList.remove('on'); setTimeout(() => { if (!quickN) qc.hidden = true }, 200); return }
    const list = [...(n.mine || []).map((r) => ({ r, you: true })), ...(n.theirs || []).map((r) => ({ r, you: false }))]
      .sort((x, y) => ({ overdue: 0, due: 1, open: 2 })[x.r.state] - ({ overdue: 0, due: 1, open: 2 })[y.r.state] || (x.r.due || '9').localeCompare(y.r.due || '9'))
    const person = n.kind === 'person'
    const pic = n.photo ? `<span class="pic" style="background-image:url('${n.photo}')"></span>` : person ? `<span class="pic sil" style="--tint:${tintOf(n)}"></span>` : `<span class="pic thing" style="--tint:${tintOf(n)}">${esc(initials(n))}</span>`
    const nm = (s) => esc((s || '').split(/[ ,]/)[0])
